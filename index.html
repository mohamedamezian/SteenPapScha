<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediaPipe Gesture (RPS)</title>
    <link rel="stylesheet" href="styles.css" />

    <!-- MediaPipe Hands (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  </head>

  <body>
    <main class="app">
      <h1 class="title">Gesture detection (Rock / Paper / Scissors)</h1>

      <section class="layout" aria-label="Gesture detection layout">
        <div class="stage" aria-label="Camera canvas">
          <video class="input_video" playsinline></video>
          <canvas class="output_canvas"></canvas>
        </div>

          <button id="toggleCamera" class="btn">Start camera</button>

          <div class="box">
            <div class="label">Detected</div>
            <div id="gesture" class="gesture">—</div>
          </div>

          <div id="status" class="status">Click “Start camera”, then show a hand pose.</div>
      </section>
    </main>

    <script src="main.js"></script>
  </body>
</html>
